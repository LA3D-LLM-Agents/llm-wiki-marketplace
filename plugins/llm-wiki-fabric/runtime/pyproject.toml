[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-wiki-fabric"
version = "0.1.0"
description = "Resource discovery and direct research queries for llm-wiki agents"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.28,<2",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "PyYAML>=6,<7",
  "rdflib>=7,<8",
  "psycopg[binary]>=3.2,<4",
  "sqlglot>=28,<29",
  "pyshacl==0.40.1",
]

[project.scripts]
llm-wiki-fabric = "llm_wiki_fabric.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=1,<2", "ruff>=0.12"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: requires PAD and the locally provisioned PostgreSQL role"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
