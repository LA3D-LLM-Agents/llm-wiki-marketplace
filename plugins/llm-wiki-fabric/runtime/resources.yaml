schema_version: 1
connection_profiles:
  rare-disease-local:
    kind: postgresql
    host: localhost
    host_env: RARE_DISEASE_DB_HOST
    port: 5432
    database: raredisease
    auth_profile: rare-disease-readonly
resources:
- id: pad
  descriptor: https://pad.crc.nd.edu/.well-known/did.json
  descriptor_format: did-web
  semantic_entrypoint: download_ontology
  allowed_tools:
  - download_ontology
  - get_api_ld_v3_projects
  - get_api_ld_v3_project_by_name_project_name
  - get_api_ld_v3_cards_by_project_project_name_sample_ids
  - get_api_ld_v3_cards_by_project_project_name_sample_id_ranges
  - get_api_ld_v3_cards_by_sample_sample_id
  - get_api_ld_v3_layout_layout_name
- id: rare-disease-db
  descriptor: descriptors/rare-disease-db.json
  descriptor_format: fabric
  connection_profile: rare-disease-local
  allowed_tables:
  - publications_disease
  - publications_publication
  - publications_source
  - publications_publication_diseases
  - publications_publication_sources
  - publications_clinical_trial
